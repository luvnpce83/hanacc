---
layout: default
---
<article>
  <header class="page-head">
    <div class="container">
      <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News &amp; Events</a></p>
      <h1>{{ page.title }}</h1>
      <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </div>
  </header>
  <div class="container page-body prose">
    {{ content }}
    <p class="back-link"><a href="{{ '/news/' | relative_url }}">← All news &amp; events</a></p>
  </div>
</article>
